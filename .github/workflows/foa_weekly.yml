name: FOA weekly report

on:
  schedule:
    # Sundays at 13:00 UTC
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the report instead of posting to Slack, and skip committing state (safe to click anytime, e.g. to demo)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  foa-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FOA report
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_DOMAIN: ${{ secrets.SF_DOMAIN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/foa_report.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Show report in run summary (dry run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cat reports/foa_report_*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reported_contacts.json data/known_foa_contacts.json reports/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update FOA state after weekly run"
            git push
          fi
